<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Stock Market Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card" style="max-width: 520px;">
      <div class="auth-logo">
        <div class="brand-icon">📈</div>
        <div class="brand-title" style="font-size: 1.3rem;">ApexTrader</div>
      </div>

      <div class="auth-header">
        <h2>Register Trader Account</h2>
        <p>Start simulated trading with $10,000 virtual balance</p>
      </div>

      <div id="registerAlert" class="alert alert-danger" role="alert"></div>
      <div id="registerSuccess" class="alert alert-success" role="alert"></div>

      <form id="registerForm">
        <div class="form-group">
          <label class="form-label" for="fullName">Full Name *</label>
          <input type="text" id="fullName" class="form-control" placeholder="John Doe" required>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label class="form-label" for="email">Email Address *</label>
            <input type="email" id="email" class="form-control" placeholder="john@example.com" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="phone">Phone Number *</label>
            <input type="tel" id="phone" class="form-control" placeholder="+1-555-0100" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="username">Username *</label>
          <input type="text" id="username" class="form-control" placeholder="johndoe123" required minlength="3">
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label class="form-label" for="password">Password *</label>
            <input type="password" id="password" class="form-control" placeholder="Min 6 characters" required minlength="6">
          </div>
          <div class="form-group">
            <label class="form-label" for="confirmPassword">Confirm Password *</label>
            <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter password" required minlength="6">
          </div>
        </div>

        <button type="submit" id="btnRegisterSubmit" class="btn btn-primary" style="width: 100%; margin-top: 10px; padding: 12px;">
          Create My Trading Account
        </button>
      </form>

      <div class="auth-footer">
        Already registered? <a href="login.html">Sign In here</a>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertEl = document.getElementById('registerAlert');
      const successEl = document.getElementById('registerSuccess');
      const submitBtn = document.getElementById('btnRegisterSubmit');

      alertEl.classList.remove('show');
      successEl.classList.remove('show');

      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (!fullName || !email || !phone || !username || !password || !confirmPassword) {
        alertEl.textContent = 'Please fill out all mandatory fields.';
        alertEl.classList.add('show');
        return;
      }

      if (password !== confirmPassword) {
        alertEl.textContent = 'Passwords do not match. Please re-enter.';
        alertEl.classList.add('show');
        return;
      }

      if (password.length < 6) {
        alertEl.textContent = 'Password must be at least 6 characters.';
        alertEl.classList.add('show');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account...';

      try {
        const res = await apiRequest('/api/auth/register', {
          method: 'POST',
          body: { fullName, email, phone, username, password, confirmPassword }
        });

        if (res && res.success) {
          successEl.textContent = 'Account created successfully! Redirecting to login...';
          successEl.classList.add('show');
          document.getElementById('registerForm').reset();
          setTimeout(() => {
            window.location.href = `${CONTEXT_PATH}/login.html`;
          }, 1500);
        } else {
          throw new Error(res.message || 'Registration failed.');
        }
      } catch (err) {
        alertEl.textContent = err.message;
        alertEl.classList.add('show');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create My Trading Account';
      }
    });
  </script>
</body>
</html>
